<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Projekt X · MVP 12.4</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#050505}</style></head><body><iframe id="shell" src="mvp116.html?v=117"></iframe><script>
const shell=document.getElementById('shell');
const PICS={kolesarjenje:'https://images.unsplash.com/photo-1541625602330-2277a4c46182?auto=format&fit=crop&w=1000&q=82',kosarka:'https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1000&q=82',sport:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1000&q=82',gaming:'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1000&q=82',sprehod:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=82',kava:'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1000&q=82',drugo:'https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1000&q=82'};
const NAMECAT={'Kolesarjenje':'kolesarjenje','Košarka':'kosarka','Šport':'sport','Gaming':'gaming','Sprehod':'sprehod','Kava':'kava'};
function install(){const od=shell.contentDocument;if(!od)return;const inner=od.getElementById('app');if(!inner)return;const patch=()=>{const w=inner.contentWindow,d=inner.contentDocument;if(!w||!d)return;
if(!d.getElementById('px124')){const s=d.createElement('style');s.id='px124';s.textContent=`
.bottomnav{grid-template-columns:1fr 64px 1fr!important;align-items:center!important}.bottomnav .navbtn{min-height:48px!important;padding:7px 6px!important;font-size:12px!important;font-weight:800!important;line-height:1.25!important;color:#a0a0a0!important;border-radius:12px!important}.bottomnav .navbtn.active{color:var(--lime)!important}.bottomnav .navplus{width:50px!important;height:50px!important;font-size:29px!important}
.onboard-wrap{max-width:520px;margin:0 auto}.stepper{display:flex;gap:6px;margin:8px 0 18px}.stepper span{height:4px;flex:1;border-radius:999px;background:#232323}.stepper span.on{background:var(--lime)}.onboard-label{font-size:11px;letter-spacing:.08em;color:var(--lime);font-weight:900;text-transform:uppercase;margin-bottom:6px}.onboard-title{font-size:31px;font-weight:950;letter-spacing:-.04em;line-height:1.05;margin:0 0 7px}.onboard-sub{color:#9a9a9a;font-size:14px;line-height:1.45;margin-bottom:14px}.onboard-card{background:linear-gradient(145deg,#141414,#0b0b0b);border:1px solid #292929;border-radius:20px;padding:14px;margin:10px 0}.fieldlabel{display:block;color:#a5a5a5;font-size:12px;font-weight:750;margin:9px 2px 3px}#login .hero{min-height:230px!important;margin-top:4px!important}.login-note{font-size:11px;color:#777;text-align:center;margin-top:10px;line-height:1.4}#step1 h1,#step2 h1{display:none}.step2-note{font-size:12px;color:#8c8c8c;margin:8px 0 0}#step2 .card{padding:10px!important;background:transparent!important;border:0!important}.choices{margin-top:2px}
.msgStatus{font-size:11px;color:#888;margin:6px 0 0}.oldDelete{border:1px solid #513030;background:#170d0d;color:#ffb0b0;width:100%;margin-top:9px;min-height:44px;border-radius:14px;font-weight:850}.oldBadge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#151515;border:1px solid #333;color:#999;font-size:10px;font-weight:800}
@media(max-width:390px){.bottomnav .navbtn{font-size:11.5px!important;min-height:46px!important}.bottomnav .navplus{width:48px!important;height:48px!important}.onboard-title{font-size:29px}.onboard-sub{font-size:13px}}`;d.head.appendChild(s)}
const tag=d.querySelector('.tag');if(tag)tag.textContent='MVP 12.4 · ZDAJ';
function stepper(n){return `<div class="stepper"><span class="${n>=1?'on':''}"></span><span class="${n>=2?'on':''}"></span><span class="${n>=3?'on':''}"></span></div>`}
function setupOnboarding(){const login=d.getElementById('login');if(login&&!login.dataset.px122){login.dataset.px122='1';const hero=login.querySelector('.hero'),card=login.querySelector('.card');if(hero&&card){const wrap=d.createElement('div');wrap.className='onboard-wrap';hero.parentNode.insertBefore(wrap,hero);wrap.appendChild(hero);wrap.appendChild(card);card.className='onboard-card';const input=d.getElementById('email');card.innerHTML=`${stepper(1)}<div class="onboard-label">1 · Prijava</div><div class="onboard-title">Vstopi v Projekt X</div><div class="onboard-sub">Za začetek uporabi e-pošto. Kasneje dodava tudi Apple in Google prijavo.</div><label class="fieldlabel">E-pošta</label>`;card.appendChild(input);const btn=d.createElement('button');btn.className='cta';btn.textContent='Nadaljuj';btn.onclick=()=>w.demoLogin&&w.demoLogin();card.appendChild(btn);const note=d.createElement('div');note.className='login-note';note.textContent='Testna verzija: račun je za zdaj shranjen lokalno na tej napravi.';card.appendChild(note)}}const s1=d.getElementById('step1');if(s1&&!s1.dataset.px122){s1.dataset.px122='1';const card=s1.querySelector('.card');if(card){const wrap=d.createElement('div');wrap.className='onboard-wrap';s1.insertBefore(wrap,s1.firstChild);wrap.innerHTML=`${stepper(2)}<div class="onboard-label">2 · Osnovni profil</div><div class="onboard-title">Da te ljudje prepoznajo</div><div class="onboard-sub">Povej samo toliko, kolikor je potrebno za lokalne aktivnosti.</div>`;wrap.appendChild(card);const fields=[[d.getElementById('name'),'Ime ali vzdevek'],[d.getElementById('area'),'Kraj'],[d.getElementById('region'),'Regija'],[d.getElementById('age'),'Starostni razpon']];card.innerHTML='';fields.forEach(([el,label])=>{const l=d.createElement('label');l.className='fieldlabel';l.textContent=label;card.appendChild(l);card.appendChild(el)});const oldBtn=s1.querySelector('.cta');if(oldBtn){oldBtn.remove();wrap.appendChild(oldBtn);oldBtn.textContent='Naprej · izberi interese'}}}const s2=d.getElementById('step2');if(s2&&!s2.dataset.px122){s2.dataset.px122='1';const intro=d.createElement('div');intro.className='onboard-wrap';intro.innerHTML=`${stepper(3)}<div class="onboard-label">3 · Interesi</div><div class="onboard-title">Kaj bi počel z drugimi?</div><div class="onboard-sub">Izberi vsaj eno stvar. To uporabljamo za “Zate zdaj”.</div>`;const card=s2.querySelector('.card'),btn=s2.querySelector('.cta');s2.insertBefore(intro,s2.firstChild);if(card)intro.appendChild(card);if(btn){intro.appendChild(btn);btn.textContent='Končaj in vstopi'}const note=d.createElement('div');note.className='step2-note';note.textContent='Interese lahko kasneje kadarkoli spremeniš v profilu.';if(btn)intro.insertBefore(note,btn)}}
const origImgFor=w.imgFor;w.imgFor=c=>PICS[c]||PICS.drugo||(origImgFor?origImgFor(c):'');
function fixChoices(){d.querySelectorAll('.choice').forEach(btn=>{const text=(btn.textContent||'').trim();const key=Object.keys(NAMECAT).find(n=>text.includes(n)),im=btn.querySelector('img');if(key&&im){im.src=PICS[NAMECAT[key]];im.onerror=()=>{im.style.display='none';btn.style.background='#141414'}}})}
function fixFeed(){d.querySelectorAll('.feeditem').forEach(card=>{const text=(card.textContent||'').toLowerCase();let cat='drugo';if(text.includes('košarka')||text.includes('kosarka'))cat='kosarka';else if(text.includes('kolesarjenje'))cat='kolesarjenje';else if(text.includes('gaming'))cat='gaming';else if(text.includes('sprehod'))cat='sprehod';else if(text.includes('kava'))cat='kava';else if(text.includes('šport')||text.includes('sport'))cat='sport';const im=card.querySelector('.feedimg');if(im){im.src=PICS[cat];im.onerror=()=>im.style.display='none'}})}
const origRender=w.renderActivity;if(typeof origRender==='function'&&!w.__pxImg124){w.__pxImg124=true;w.renderActivity=function(x,join=true){let html=origRender.call(w,x,join),src=PICS[x.category]||PICS.drugo;return html.replace(/<img class="feedimg" src="[^"]*">/,`<img class="feedimg" src="${src}" onerror="this.style.display='none'">`)}}
async function loadHomeAll(){if(!w.profile)return;const feed=d.getElementById('feed');if(!feed)return;feed.innerHTML='<div class="loading">Nalagam aktivnosti …</div>';try{const j=await w.api('activity_list');let items=(j.items||[]).filter(x=>x.creator_device_id!==w.deviceId);const interests=w.profile.interests||[];items.sort((a,b)=>{const am=w.hasAny(interests,w.interestMap[a.category]||[])?1:0,bm=w.hasAny(interests,w.interestMap[b.category]||[])?1:0;return bm-am||new Date(b.created_at||0)-new Date(a.created_at||0)});feed.innerHTML=items.length?items.slice(0,8).map(x=>w.renderActivity(x,true)).join(''):'<div class="empty">Trenutno ni aktivnih aktivnosti v bližini. Bodi prvi in objavi svojo.</div>';fixFeed()}catch(e){feed.innerHTML='<div class="empty">Aktivnosti trenutno niso dosegljive.</div>'}}
const baseLoadHome=w.loadHome;w.loadHome=async function(){if(typeof baseLoadHome==='function')await baseLoadHome.apply(w,arguments);await loadHomeAll()};
/* SPOROČILA: neposreden, zanesljiv send + Enter + osvežitev */
w.sendMsg=async function(){const input=d.getElementById('msg');if(!input)return;const body=input.value.trim();if(!body)return;const code=localStorage.getItem('px101code')||'';if(!code){w.toast&&w.toast('Najprej odpri aktivnost');return}const btn=d.querySelector('#plan .mini.good');if(btn){btn.disabled=true;btn.textContent='…'}try{await w.api('message','POST',{code,body});input.value='';await w.loadMessages();const box=d.getElementById('messages');if(box)box.scrollTop=box.scrollHeight}catch(e){w.toast&&w.toast(e&&e.message==='plan_closed'?'Aktivnost je zaključena':'Sporočila ni uspelo poslati')}finally{if(btn){btn.disabled=false;btn.textContent='➤'}}};
const msg=d.getElementById('msg');if(msg&&!msg.dataset.px124){msg.dataset.px124='1';msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();w.sendMsg()}})}
const oldLoadMessages=w.loadMessages;if(typeof oldLoadMessages==='function'){w.loadMessages=async function(){await oldLoadMessages.apply(w,arguments);const box=d.getElementById('messages');if(box)box.scrollTop=box.scrollHeight}}
/* MOJE OBJAVE: aktivne odstrani, stare lahko uporabnik izbriše iz svojega seznama */
const hiddenKey='px124_hidden_old_posts';function hiddenIds(){try{return JSON.parse(localStorage.getItem(hiddenKey)||'[]')}catch(e){return[]}}function saveHidden(a){localStorage.setItem(hiddenKey,JSON.stringify([...new Set(a)]))}
w.hideOldPost=function(id){if(!confirm('Izbrišem staro objavo iz seznama?'))return;const ids=hiddenIds();ids.push(id);saveHidden(ids);w.toast&&w.toast('Stara objava izbrisana');w.openMyPosts()};
w.openMyPosts=async function(){w.show&&w.show('myposts');const box=d.getElementById('myActivities');if(box)box.innerHTML='<div class="loading">Nalagam tvoje objave …</div>';try{const j=await w.api('my_posts'),hidden=hiddenIds(),acts=(j.activities||[]).filter(x=>!hidden.includes(x.id));if(box)box.innerHTML=acts.length?acts.map(x=>{const active=x.status==='open'||x.status==='full';const status=active?'ZDAJ':(x.status==='completed'?'zaključena':x.status==='cancelled'?'odstranjena':x.status);return `<div class="feeditem"><img class="feedimg" src="${PICS[x.category]||PICS.drugo}"><div class="feedbody"><div class="row"><b>${w.esc(x.title)}</b><span class="${active?'now':'oldBadge'}">${w.esc(status)}</span></div><div class="mut small" style="margin-top:7px">📍 ${w.esc(x.area||'')}</div>${active?`<button class="danger" onclick="cancelActivity('${x.id}')">Odstrani aktivnost</button>`:`<button class="oldDelete" onclick="hideOldPost('${x.id}')">Izbriši staro objavo</button>`}</div></div>`}).join(''):'<div class="empty">Nimaš objav.</div>';fixFeed()}catch(e){if(box)box.innerHTML='<div class="empty">Ni uspelo naložiti objav.</div>'}};
const baseCreate=w.createActivity;if(typeof baseCreate==='function'&&!w.__pxCreate124){w.__pxCreate124=true;w.createActivity=async function(){const r=await baseCreate.apply(w,arguments);setTimeout(loadHomeAll,250);return r}}
setupOnboarding();fixChoices();fixFeed();if(w.profile&&d.getElementById('home')?.classList.contains('on'))loadHomeAll();const ob=new MutationObserver(()=>{setupOnboarding();fixChoices();fixFeed()});ob.observe(d.body,{subtree:true,childList:true});};inner.addEventListener('load',patch);if(inner.contentDocument&&inner.contentDocument.readyState==='complete')patch()};shell.addEventListener('load',install);
</script></body></html>
