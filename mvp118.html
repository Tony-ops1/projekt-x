<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Projekt X · MVP 11.9</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#050505}</style></head><body><iframe id="shell" src="mvp116.html?v=117"></iframe><script>
const shell=document.getElementById('shell');
const PICS={
  kolesarjenje:'https://images.unsplash.com/photo-1541625602330-2277a4c46182?auto=format&fit=crop&w=1000&q=82',
  kosarka:'https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1000&q=82',
  sport:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1000&q=82',
  gaming:'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1000&q=82',
  sprehod:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=82',
  kava:'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1000&q=82',
  drugo:'https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1000&q=82'
};
const nameToCat={'Kolesarjenje':'kolesarjenje','Košarka':'kosarka','Šport':'sport','Gaming':'gaming','Sprehod':'sprehod','Kava':'kava'};
function install(){
  const outerDoc=shell.contentDocument; if(!outerDoc)return;
  const inner=outerDoc.getElementById('app'); if(!inner)return;
  const patch=()=>{
    const w=inner.contentWindow,d=inner.contentDocument;if(!w||!d)return;
    const originalImgFor=w.imgFor;
    w.imgFor=function(c){return PICS[c]||PICS.drugo||(originalImgFor?originalImgFor(c):'')};
    const tag=d.querySelector('.tag');if(tag)tag.textContent='MVP 11.9 · ZDAJ';
    function fixChoices(){
      d.querySelectorAll('.choice').forEach(btn=>{
        const text=(btn.textContent||'').trim();
        const key=Object.keys(nameToCat).find(n=>text.includes(n));
        const im=btn.querySelector('img');
        if(key&&im){const src=PICS[nameToCat[key]];if(im.src!==src)im.src=src;im.onerror=()=>{im.style.display='none';btn.style.background='#141414'}}
      });
    }
    function fixFeed(){
      d.querySelectorAll('.feeditem').forEach(card=>{
        const text=(card.textContent||'').toLowerCase();
        let cat='drugo';
        if(text.includes('kosarka')||text.includes('košarka'))cat='kosarka';
        else if(text.includes('kolesarjenje'))cat='kolesarjenje';
        else if(text.includes('gaming'))cat='gaming';
        else if(text.includes('sprehod'))cat='sprehod';
        else if(text.includes('kava'))cat='kava';
        else if(text.includes('sport')||text.includes('šport'))cat='sport';
        const im=card.querySelector('.feedimg');if(im){im.src=PICS[cat];im.onerror=()=>{im.style.display='none'}}
      });
    }
    const origRender=w.renderActivity;
    if(typeof origRender==='function'&&!w.__pxImagePatched){
      w.__pxImagePatched=true;
      w.renderActivity=function(x,join=true){
        let html=origRender.call(w,x,join);
        const src=PICS[x.category]||PICS.drugo;
        return html.replace(/<img class="feedimg" src="[^"]*">/,`<img class="feedimg" src="${src}" onerror="this.style.display='none'">`);
      };
    }
    fixChoices();fixFeed();
    const ob=new MutationObserver(()=>{fixChoices();fixFeed()});ob.observe(d.body,{subtree:true,childList:true});
  };
  inner.addEventListener('load',patch);
  if(inner.contentDocument&&inner.contentDocument.readyState==='complete')patch();
}
shell.addEventListener('load',install);
</script></body></html>
