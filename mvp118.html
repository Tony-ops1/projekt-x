const f=document.getElementById('app');
f.addEventListener('load',()=>{
 const w=f.contentWindow,d=f.contentDocument;if(!w||!d)return;
 const oldImgFor=w.imgFor;
 w.imgFor=function(c){if(c==='sport')return SPORT;if(c==='kosarka')return BASKET;if(c==='gaming')return GAMING;return oldImgFor?oldImgFor(c):SPORT};
 const style=d.createElement('style');style.textContent=`.app{max-width:560px!important;padding-left:16px!important;padding-right:16px!important}.choice{min-height:96px!important;border-radius:17px!important}.choice span{font-size:13px!important}.cta{min-height:46px!important}.navplus{width:48px!important;height:48px!important}.filterchip,.mini,.back{min-height:38px!important}`;d.head.appendChild(style);
 const tag=d.querySelector('.tag');if(tag)tag.textContent='MVP 11.8 · ZDAJ';
 const names={'Šport':SPORT,'Košarka':BASKET,'Gaming':GAMING};
 function patchChoices(){[...d.querySelectorAll('#quickCats .choice,#interests .choice,#editInterests .choice')].forEach(b=>{const txt=(b.textContent||'').trim();for(const [name,src] of Object.entries(names)){if(txt.includes(name)){const im=b.querySelector('img');if(im)im.src=src}}});}
 const filterMap={Vse:null,'Šport':'sport','Kava':'kava','Sprehod':'sprehod','Kolesarjenje':'kolesarjenje'};let active='Vse',items=[];
 function render(){const feed=d.getElementById('feed');if(!feed)return;let x=[...items],c=filterMap[active];if(c)x=x.filter(i=>i.category===c||(c==='sport'&&i.category==='kosarka'));feed.innerHTML=x.length?x.slice(0,6).map(i=>w.renderActivity(i,true)).join(''):'<div class="empty">Trenutno ni aktivnosti v tej kategoriji.</div>';}
 async function refresh(){if(!w.profile)return;try{const j=await w.api('activity_list');items=(j.items||[]).filter(x=>x.creator_device_id!==w.deviceId&&w.hasAny(w.profile.interests,w.interestMap[x.category]||[]));render()}catch(e){}}
 function wireFilters(){[...d.querySelectorAll('#home .filterchip')].forEach(b=>{b.onclick=()=>{active=b.textContent.trim();[...d.querySelectorAll('#home .filterchip')].forEach(x=>x.classList.toggle('on',x===b));render()}})}
 function wireQuick(){[...d.querySelectorAll('#quickCats .choice')].forEach(b=>{const txt=(b.textContent||'').trim();b.onclick=()=>{[...d.querySelectorAll('#quickCats .choice')].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const name=txt.replace(/^\S+\s*/,'');if(w.quickCat)w.quickCat(name)}})}
 const oldShow=w.show;if(oldShow)w.show=function(id){const r=oldShow.call(w,id);setTimeout(()=>{patchChoices();wireFilters();wireQuick();if(id==='home')refresh()},0);return r};
 patchChoices();wireFilters();wireQuick();if(w.profile)refresh();
 const obs=new MutationObserver(()=>{patchChoices();wireFilters();wireQuick()});obs.observe(d.body,{subtree:true,childList:true});
});
</script></body></html>
