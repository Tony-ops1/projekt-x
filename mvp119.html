<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Projekt X · MVP 12.5</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#050505}</style></head><body><iframe id="v124" src="mvp118.html?v=124"></iframe><script>
const frame=document.getElementById('v124');
const LOC_API='https://ceudducaxmwcwscguzle.supabase.co/functions/v1/projekt-x-location';
function install(){
  const d1=frame.contentDocument;if(!d1)return;const shell=d1.getElementById('shell');if(!shell)return;
  const waitOuter=()=>{const d2=shell.contentDocument;if(!d2)return;const inner=d2.getElementById('app');if(!inner)return;
    const patch=()=>{const w=inner.contentWindow,d=inner.contentDocument;if(!w||!d||w.__px125)return;w.__px125=true;
      const tag=d.querySelector('.tag');if(tag)tag.textContent='MVP 12.5 · ZDAJ';
      const st=d.createElement('style');st.textContent=`
      .loccard{margin:12px 0 4px;padding:12px;border:1px solid #2b2b2b;border-radius:17px;background:#0f0f0f}.locrow{display:flex;gap:8px;align-items:center}.locrow .mini{flex:1}.radiusbar{display:flex;gap:7px;overflow:auto;margin-top:9px}.radiusbtn{white-space:nowrap;border:1px solid #303030;background:#141414;color:#aaa;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}.radiusbtn.on{background:var(--lime);border-color:var(--lime);color:#050505}.locstatus{font-size:12px;color:#909090;margin-top:8px}.distance{color:var(--lime);font-weight:850}`;d.head.appendChild(st);
      const state={radius:Number(localStorage.getItem('px125radius')||25),lat:Number(localStorage.getItem('px125lat')),lon:Number(localStorage.getItem('px125lon'))};
      const hasLoc=()=>Number.isFinite(state.lat)&&Number.isFinite(state.lon);
      async function locApi(action,method='GET',body=null,extra=''){const r=await fetch(LOC_API+'?action='+action+extra+(method==='GET'?'&_='+Date.now():''),{method,headers:{'Content-Type':'application/json','x-device-id':w.deviceId},body:body?JSON.stringify(body):null,cache:'no-store'});const q=await r.json();if(!r.ok)throw new Error(q.error||'Napaka');return q}
      function ensureBox(){const home=d.getElementById('home');if(!home)return;let box=d.getElementById('pxLocBox');if(box)return box;const filters=home.querySelector('.filterbar');box=d.createElement('div');box.id='pxLocBox';box.className='loccard';box.innerHTML=`<div class="locrow"><button class="mini" id="pxUseLoc">📍 Uporabi trenutno lokacijo</button></div><div class="locstatus" id="pxLocStatus">Lokacija še ni vključena.</div><div class="radiusbar" id="pxRadius"></div>`;if(filters)filters.parentNode.insertBefore(box,filters);else home.insertBefore(box,home.firstChild);d.getElementById('pxUseLoc').onclick=useLocation;renderRadius();renderStatus();return box}
      function renderRadius(){const bar=d.getElementById('pxRadius');if(!bar)return;bar.innerHTML=[5,10,25,50].map(r=>`<button class="radiusbtn ${state.radius===r?'on':''}" data-r="${r}">${r} km</button>`).join('');bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.radius=Number(b.dataset.r);localStorage.setItem('px125radius',String(state.radius));renderRadius();if(hasLoc())loadNearby()})}
      function renderStatus(){const el=d.getElementById('pxLocStatus');if(!el)return;el.textContent=hasLoc()?`Trenutna lokacija vključena · prikaz do ${state.radius} km`:'Za aktivnosti v bližini dovoli trenutno lokacijo.'}
      function useLocation(){if(!navigator.geolocation){w.toast&&w.toast('Telefon ne podpira lokacije');return}const btn=d.getElementById('pxUseLoc');if(btn){btn.disabled=true;btn.textContent='Določam lokacijo …'}navigator.geolocation.getCurrentPosition(async p=>{state.lat=p.coords.latitude;state.lon=p.coords.longitude;localStorage.setItem('px125lat',String(state.lat));localStorage.setItem('px125lon',String(state.lon));try{await locApi('save_location','POST',{latitude:state.lat,longitude:state.lon,accuracy:p.coords.accuracy});renderStatus();w.toast&&w.toast('Lokacija posodobljena');await loadNearby()}catch(e){w.toast&&w.toast('Lokacije ni uspelo shraniti')}finally{if(btn){btn.disabled=false;btn.textContent='📍 Posodobi trenutno lokacijo'}}},()=>{w.toast&&w.toast('Dovoli lokacijo v nastavitvah brskalnika');if(btn){btn.disabled=false;btn.textContent='📍 Uporabi trenutno lokacijo'}},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
      function distanceHtml(x){return x.distance_km!=null?`<span class="distance"> · ${String(x.distance_km).replace('.',',')} km stran</span>`:''}
      const baseRender=w.renderActivity;w.renderActivity=function(x,join=true){let html=baseRender.call(w,x,join);if(x.distance_km!=null)html=html.replace(`📍 ${w.esc(x.area)} ·`,`📍 ${w.esc(x.area)}${distanceHtml(x)} ·`);return html}
      async function loadNearby(){ensureBox();const feed=d.getElementById('feed');if(!feed)return;if(!hasLoc()){renderStatus();return}feed.innerHTML='<div class="loading">Iščem aktivnosti v bližini …</div>';try{const j=await locApi('nearby','GET',null,'&radius='+state.radius);let items=j.items||[];const interests=w.profile?.interests||[];items.sort((a,b)=>{const am=w.hasAny(interests,w.interestMap[a.category]||[])?1:0,bm=w.hasAny(interests,w.interestMap[b.category]||[])?1:0;return bm-am||(a.distance_km??999)-(b.distance_km??999)});feed.innerHTML=items.length?items.slice(0,10).map(x=>w.renderActivity(x,true)).join(''):`<div class="empty">V radiju ${state.radius} km trenutno ni aktivnosti. Poskusi večji radij ali objavi svojo.</div>`}catch(e){feed.innerHTML='<div class="empty">Aktivnosti v bližini trenutno niso dosegljive.</div>'}}
      const oldLoadHome=w.loadHome;w.loadHome=async function(){if(typeof oldLoadHome==='function')await oldLoadHome.apply(w,arguments);ensureBox();if(hasLoc())await loadNearby()};
      const oldCreate=w.createActivity;w.createActivity=async function(){if(!hasLoc()){w.toast&&w.toast('Najprej vključi trenutno lokacijo');ensureBox();return}const r=await oldCreate.apply(w,arguments);try{await locApi('attach_latest_activity','POST',{})}catch(e){}setTimeout(loadNearby,300);return r};
      const showOld=w.show;w.show=function(id){const r=showOld.call(w,id);if(id==='home')setTimeout(()=>{ensureBox();if(hasLoc())loadNearby()},100);return r};
      ensureBox();if(hasLoc())loadNearby();
    };
    inner.addEventListener('load',patch);if(inner.contentDocument&&inner.contentDocument.readyState==='complete')patch();
  };
  shell.addEventListener('load',waitOuter);if(shell.contentDocument&&shell.contentDocument.readyState==='complete')waitOuter();
}
frame.addEventListener('load',install);
</script></body></html>
