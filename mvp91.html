<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b12"><title>Projekt X · MVP 9.1</title><style>:root{--bg:#050b12;--card:#0b1620;--line:#203746;--txt:#f4fbff;--mut:#87a0b0;--a:#66e7ff;--ok:#5fe1a3;--hot:#ff9c85}*{box-sizing:border-box}body{margin:0;background:#050b12;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:800;letter-spacing:.12em}.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--a)}h1{font-size:34px;margin:12px 0}.mut{color:var(--mut);line-height:1.45}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}textarea,input{width:100%;border:1px solid var(--line);background:#091821;color:var(--txt);border-radius:15px;padding:13px;font:inherit}textarea{min-height:100px;resize:none}.btn{width:100%;border:0;border-radius:16px;padding:14px;margin-top:10px;font-weight:800;background:var(--a);color:#031018}.btn.hot{background:var(--hot)}.status{font-size:12px;color:var(--ok)}.item{border-left:4px solid var(--ok)}.item b{font-size:18px}.tiny{font-size:11px;color:var(--mut);margin-top:7px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.code{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);word-break:break-all}.hide{display:none}</style></head><body><div class="app"><div class="top"><div class="brand">PROJEKT X</div><div class="tag">MVP 9.1 · TEST</div></div><h1>Pomoč v živo</h1><div class="mut">Telefon A objavi težavo. Telefon B jo mora videti spodaj v nekaj sekundah.</div><div class="card"><div class="tiny">Ta telefon</div><div id="deviceLabel" class="code"></div><input id="name" placeholder="Ime" value="Toni" style="margin-top:10px"><textarea id="problem" placeholder="Npr. Ne dela mi Wi‑Fi"></textarea><button class="btn hot" onclick="createHelp()">🆘 Potrebujem pomoč zdaj</button></div><div class="row"><h2>Pomoč v bližini</h2><div id="state" class="status">● povezujem…</div></div><div id="list"><div class="card mut">Nalaganje…</div></div><button class="btn" onclick="loadHelp(true)">↻ Osveži seznam</button></div><script>const API='https://ceudducaxmwcwscguzle.supabase.co/functions/v1/projekt-x-api';let deviceId=localStorage.getItem('px91device');if(!deviceId){deviceId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).replaceAll('-','');localStorage.setItem('px91device',deviceId)}document.getElementById('deviceLabel').textContent='ID: '+deviceId.slice(0,12);let timer=null;function H(){return {'Content-Type':'application/json','x-device-id':deviceId}}async function api(action,method='GET',body=null){let u=API+'?action='+encodeURIComponent(action)+(method==='GET'?'&_='+Date.now():'');let r=await fetch(u,{method,headers:H(),body:body?JSON.stringify(body):null,cache:'no-store'});let j=await r.json();if(!r.ok)throw new Error(j.error||'Napaka');return j}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function createHelp(){let title=document.getElementById('problem').value.trim();let nm=document.getElementById('name').value.trim()||'Gost';if(title.length<3){alert('Opiši težavo');return}try{await api('help_create','POST',{title,category:'tehnika',requester_name:nm,area:'Novo mesto'});document.getElementById('problem').value='';await loadHelp();}catch(e){alert('Napaka pri objavi: '+e.message)}}async function loadHelp(show=false){const st=document.getElementById('state'),list=document.getElementById('list');try{let j=await api('help_list');let items=Array.isArray(j.items)?j.items:[];st.textContent='● prejeto: '+items.length;st.style.color='var(--ok)';list.innerHTML=items.length?items.map(x=>'<div class="card item"><b>'+esc(x.title)+'</b><div class="mut">'+esc(x.requester_name)+' · '+esc(x.area)+'</div><div class="tiny">'+esc(x.category)+' · '+esc(x.status)+'</div>'+(x.status==='open'?'<button class="btn" onclick="acceptHelp(\''+x.id+'\')">Pomagam</button>':'')+'</div>').join(''):'<div class="card mut">Ni odprtih prošenj.</div>';if(show)alert('Prejeto '+items.length+' prošenj');}catch(e){st.textContent='brez povezave';st.style.color='var(--hot)';list.innerHTML='<div class="card mut">Napaka: '+esc(e.message)+'</div>'}}async function acceptHelp(id){let nm=document.getElementById('name').value.trim()||'Pomočnik';try{let j=await api('help_accept','POST',{id,helper_name:nm});alert('Povezano! Plan: '+j.plan.share_code)}catch(e){alert('Napaka: '+e.message)}}async function loop(){await loadHelp();timer=setTimeout(loop,2500)}document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadHelp()});window.addEventListener('pageshow',()=>loadHelp());loadHelp();timer=setTimeout(loop,2500);</script></body></html>
