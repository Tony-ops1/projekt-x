<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Projekt X · MVP 11.6</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#050505}</style></head><body><iframe id="app" src="mvp10.html?v=115"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;const labels={Vse:null,'Šport':'sport','Kava':'kava','Sprehod':'sprehod','Kolesarjenje':'kolesarjenje'};async function applyFilter(label){const chips=[...d.querySelectorAll('#home .filterchip')];chips.forEach(b=>b.classList.toggle('on',b.textContent.trim()===label));try{const j=await w.api('activity_list');let items=(j.items||[]).filter(x=>x.creator_device_id!==w.deviceId&&w.hasAny(w.profile.interests,w.interestMap[x.category]||[]));const cat=labels[label];if(cat)items=items.filter(x=>x.category===cat);const feed=d.getElementById('feed');feed.innerHTML=items.length?items.slice(0,6).map(x=>w.renderActivity(x,true)).join(''):'<div class="empty">Trenutno ni aktivnosti v tej kategoriji.</div>';}catch(e){}}function wire(){const chips=[...d.querySelectorAll('#home .filterchip')];chips.forEach(b=>{b.onclick=()=>applyFilter(b.textContent.trim())});const tag=d.querySelector('.tag');if(tag)tag.textContent='MVP 11.6 · ZDAJ';}wire();const obs=new MutationObserver(wire);const home=d.getElementById('home');if(home)obs.observe(home,{subtree:true,childList:true});});</script></body></html>
