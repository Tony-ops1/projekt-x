name: Adjust Projekt X button sizes

on:
  push:
    paths:
      - '.github/workflows/adjust-button-sizes.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize button sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mvp10.html')
          s=p.read_text()
          css='''\n/* MVP 11.5 - bolj enotne velikosti tipk */\nbutton{font-family:inherit}\n.filterchip{min-height:40px;padding:9px 13px;font-size:13px}\n.mini,.back{min-height:40px;padding:9px 13px;font-size:13px}\n.cta{min-height:50px;padding:12px 16px;font-size:14px;border-radius:15px}\n.hero .cta{min-height:50px;padding:12px 16px}\n.navplus{width:52px;height:52px;font-size:30px}\n.navbtn{min-height:52px;font-size:11px}\n@media(max-width:430px){.filterchip{min-height:38px;padding:8px 12px}.mini,.back{min-height:38px}.cta{min-height:48px}.navplus{width:50px;height:50px}}\n'''
          if 'MVP 11.5 - bolj enotne velikosti tipk' not in s:
              s=s.replace('</style>',css+'</style>',1)
          s=s.replace('Projekt X · MVP 11.4','Projekt X · MVP 11.5').replace('MVP 11.4 · ZDAJ','MVP 11.5 · ZDAJ')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mvp10.html
          git diff --cached --quiet || git commit -m 'MVP 11.5: poenoti velikosti tipk'
          git push
