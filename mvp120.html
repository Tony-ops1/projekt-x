<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Projekt X · MVP 12.6</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#050505}</style></head><body><iframe id="px125" src="mvp119.html?v=125"></iframe><script>
const root=document.getElementById('px125');
const MEM_API='https://ceudducaxmwcwscguzle.supabase.co/functions/v1/projekt-x-membership';
function findCore(){try{const d119=root.contentDocument;if(!d119)return null;const f118=d119.getElementById('v124');if(!f118)return null;const d118=f118.contentDocument;if(!d118)return null;const shell=d118.getElementById('shell');if(!shell)return null;const d116=shell.contentDocument;if(!d116)return null;const app=d116.getElementById('app');if(!app)return null;return {w:app.contentWindow,d:app.contentDocument}}catch(e){return null}}
function install(){const core=findCore();if(!core){setTimeout(install,150);return}const {w,d}=core;if(!w||!d||w.__px126){return}w.__px126=true;
 const tag=d.querySelector('.tag');if(tag)tag.textContent='MVP 12.6 · ZDAJ';
 const st=d.createElement('style');st.id='px126style';st.textContent=`.pxActActions{margin:12px 0}.pxDelete,.pxLeave{width:100%;min-height:48px;border-radius:15px;font-weight:900;margin-top:8px}.pxDelete{border:1px solid #733;background:#1b0d0d;color:#ffb2b2}.pxLeave{border:1px solid #555;background:#151515;color:#fff}.pxHint{font-size:11px;color:#888;margin-top:7px;line-height:1.4}`;d.head.appendChild(st);
 async function mem(action,method='GET',body=null,extra=''){const r=await fetch(MEM_API+'?action='+action+extra+(method==='GET'?'&_='+Date.now():''),{method,headers:{'Content-Type':'application/json','x-device-id':w.deviceId},body:body?JSON.stringify(body):null,cache:'no-store'});const q=await r.json();if(!r.ok)throw new Error(q.error||'Napaka');return q}
 function clearPlan(){localStorage.removeItem('px101code');try{w.currentCode=''}catch(e){}}
 async function renderPlanActions(){const plan=d.getElementById('plan');if(!plan)return;let box=d.getElementById('pxActivityActions');if(!box){box=d.createElement('div');box.id='pxActivityActions';box.className='pxActActions';const chat=plan.querySelector('.card');if(chat)plan.insertBefore(box,chat);else plan.appendChild(box)}const code=localStorage.getItem('px101code')||'';if(!code){box.innerHTML='';return}try{const s=await mem('state','GET',null,'&code='+encodeURIComponent(code));if(!s.activity){box.innerHTML='';return}if(s.is_creator){box.innerHTML='<button class="pxDelete" id="pxDeleteCurrent">🗑 Izbriši mojo aktivnost</button><div class="pxHint">Izbris odstrani aktivnost, udeležence in njen klepet.</div>';d.getElementById('pxDeleteCurrent').onclick=async()=>{if(!confirm('Trajno izbrišem tvojo aktivnost?'))return;try{await mem('delete_activity','POST',{code});clearPlan();w.toast&&w.toast('Aktivnost izbrisana');w.show&&w.show('home')}catch(e){w.toast&&w.toast('Izbris ni uspel')}}}else if(s.is_member){box.innerHTML='<button class="pxLeave" id="pxLeaveCurrent">↩ Zapusti aktivnost</button><div class="pxHint">Ne boš več med udeleženci te aktivnosti.</div>';d.getElementById('pxLeaveCurrent').onclick=async()=>{if(!confirm('Zapustim to aktivnost?'))return;try{await mem('leave','POST',{code});clearPlan();w.toast&&w.toast('Aktivnost si zapustil');w.show&&w.show('home')}catch(e){w.toast&&w.toast(e.message==='creator_cannot_leave'?'Avtor aktivnosti je ne more zapustiti':'Ni uspelo zapustiti')}}}else box.innerHTML=''}catch(e){box.innerHTML=''}}
 const oldLoadPlan=w.loadPlan;if(typeof oldLoadPlan==='function')w.loadPlan=async function(){const r=await oldLoadPlan.apply(w,arguments);await renderPlanActions();return r};
 w.deleteOwnActivity=async function(id){if(!confirm('Trajno izbrišem to aktivnost?'))return;try{await mem('delete_activity','POST',{id});w.toast&&w.toast('Aktivnost izbrisana');w.openMyPosts()}catch(e){w.toast&&w.toast('Izbris ni uspel')}};
 w.openMyPosts=async function(){w.show&&w.show('myposts');const box=d.getElementById('myActivities');if(box)box.innerHTML='<div class="loading">Nalagam tvoje objave …</div>';try{const j=await w.api('my_posts'),acts=j.activities||[];if(box)box.innerHTML=acts.length?acts.map(x=>{const active=x.status==='open'||x.status==='full';const status=active?'ZDAJ':(x.status==='completed'?'zaključena':x.status==='cancelled'?'odstranjena':x.status);return `<div class="feeditem"><img class="feedimg" src="${w.imgFor(x.category)}" onerror="this.style.display='none'"><div class="feedbody"><div class="row"><b>${w.esc(x.title)}</b><span class="${active?'now':'oldBadge'}">${w.esc(status)}</span></div><div class="mut small" style="margin-top:7px">📍 ${w.esc(x.area||'')}</div><button class="pxDelete" onclick="deleteOwnActivity('${x.id}')">🗑 ${active?'Izbriši aktivnost':'Izbriši staro objavo'}</button></div></div>`}).join(''):'<div class="empty">Nimaš objav.</div>'}catch(e){if(box)box.innerHTML='<div class="empty">Ni uspelo naložiti objav.</div>'}};
 const oldShow=w.show;if(typeof oldShow==='function')w.show=function(id){const r=oldShow.call(w,id);if(id==='plan')setTimeout(renderPlanActions,100);return r};
 if(d.getElementById('plan')?.classList.contains('on'))renderPlanActions();
}
root.addEventListener('load',()=>setTimeout(install,100));setTimeout(install,300);
</script></body></html>
